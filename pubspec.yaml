name: water_bottle
description: This library add a bottle widget to your screen. You can use it as a loading indicator, a progress tracker, or any kind of measurement suits your needs.
version: 0.0.8
homepage: https://github.com/hucancode/water_bottle

environment:
  sdk: ">=3.10.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
